name: query-man-managed-acceptance

services:
  postgres:
    container_name: query-man-managed-acceptance-postgres
    environment:
      COMMERCE_EDGES_READER_PASSWORD: ${COMMERCE_EDGES_READER_PASSWORD:?set COMMERCE_EDGES_READER_PASSWORD for acceptance fixtures}
      QUERY_MAN_INCLUDE_ACCEPTANCE_FIXTURES: "1"
      SUPPORT_TICKETS_READER_PASSWORD: ${SUPPORT_TICKETS_READER_PASSWORD:?set SUPPORT_TICKETS_READER_PASSWORD for acceptance fixtures}
    volumes:
      - ./docker/postgres/init/05-control-plane.sh:/docker-entrypoint-initdb.d/05-control-plane.sh:ro
      - ./docker/postgres/init/control-migrations:/docker-entrypoint-initdb.d/control-migrations:ro
      - ./docker/postgres/init/50-support-tickets-schema.sql:/docker-entrypoint-initdb.d/50-support-tickets-schema.sql:ro
      - ./docker/postgres/init/60-support-tickets-seed.sql:/docker-entrypoint-initdb.d/60-support-tickets-seed.sql:ro
      - ./docker/postgres/init/70-commerce-edges-schema.sql:/docker-entrypoint-initdb.d/70-commerce-edges-schema.sql:ro
      - ./docker/postgres/init/80-commerce-edges-seed.sql:/docker-entrypoint-initdb.d/80-commerce-edges-seed.sql:ro
      - ./docker/postgres/init/90-validate-mvp.sql:/docker-entrypoint-initdb.d/90-validate-mvp.sql:ro
