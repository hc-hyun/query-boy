name: query-man-domain-lab

services:
  postgres:
    container_name: query-man-domain-lab-postgres
    environment:
      RETAIL_COMMERCE_READER_PASSWORD: ${RETAIL_COMMERCE_READER_PASSWORD}
      PARCEL_LOGISTICS_READER_PASSWORD: ${PARCEL_LOGISTICS_READER_PASSWORD}
      ENERGY_TELEMETRY_READER_PASSWORD: ${ENERGY_TELEMETRY_READER_PASSWORD}
      CLINICAL_OPERATIONS_READER_PASSWORD: ${CLINICAL_OPERATIONS_READER_PASSWORD}
      SAAS_BILLING_READER_PASSWORD: ${SAAS_BILLING_READER_PASSWORD}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=1000
      - -c
      - query_boy.domain_lab=on
    ports: !override
      - "127.0.0.1:${QUERY_MAN_DOMAIN_POSTGRES_PORT:-55434}:5432"
    volumes:
      - ./docker/postgres/domain-lab/46-domain-lab-bootstrap.sh:/docker-entrypoint-initdb.d/46-domain-lab-bootstrap.sh:ro
      - ./docker/postgres/domain-lab:/query-man-domain-lab:ro

  query-man:
    container_name: query-man-domain-lab-app
    environment:
      QUERY_MAN_DOMAIN_LAB: "1"
      QUERY_MAN_SOURCE_DIR: /app/config/domain-lab/sources
      RETAIL_COMMERCE_READER_PASSWORD: ${RETAIL_COMMERCE_READER_PASSWORD}
      PARCEL_LOGISTICS_READER_PASSWORD: ${PARCEL_LOGISTICS_READER_PASSWORD}
      ENERGY_TELEMETRY_READER_PASSWORD: ${ENERGY_TELEMETRY_READER_PASSWORD}
      CLINICAL_OPERATIONS_READER_PASSWORD: ${CLINICAL_OPERATIONS_READER_PASSWORD}
      SAAS_BILLING_READER_PASSWORD: ${SAAS_BILLING_READER_PASSWORD}
    ports: !override
      - "127.0.0.1:${QUERY_MAN_DOMAIN_PORT:-3101}:3000"

volumes:
  postgres_data:
    name: query-man-domain-lab-postgres-data
