name: query-man

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    container_name: query-man-postgres
    restart: unless-stopped
    environment:
      DEVELOPMENT_ISSUES_READER_PASSWORD: ${DEVELOPMENT_ISSUES_READER_PASSWORD}
      MARKET_VOC_READER_PASSWORD: ${MARKET_VOC_READER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8 --auth-host=scram-sha-256
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      TZ: ${TZ:-Asia/Seoul}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=1000
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init/01-source-bootstrap.sh:/docker-entrypoint-initdb.d/01-source-bootstrap.sh:ro
      - ./docker/postgres/init/10-development-issues-schema.sql:/docker-entrypoint-initdb.d/10-development-issues-schema.sql:ro
      - ./docker/postgres/init/20-development-issues-seed.sql:/docker-entrypoint-initdb.d/20-development-issues-seed.sql:ro
      - ./docker/postgres/init/30-market-voc-schema.sql:/docker-entrypoint-initdb.d/30-market-voc-schema.sql:ro
      - ./docker/postgres/init/40-market-voc-seed.sql:/docker-entrypoint-initdb.d/40-market-voc-seed.sql:ro
      - ./scripts/validate-static-fixtures.sh:/docker-entrypoint-initdb.d/45-validate-static-fixtures.sh:ro
      - ./docker/postgres/init/90-validate-mvp.sql:/query-man-fixtures/90-validate-mvp.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    shm_size: 256mb
    stop_grace_period: 30s

  query-man: &query-man-service
    build:
      context: .
    image: query-man:local
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DEVELOPMENT_ISSUES_READER_PASSWORD: ${DEVELOPMENT_ISSUES_READER_PASSWORD}
      MARKET_VOC_READER_PASSWORD: ${MARKET_VOC_READER_PASSWORD}
      POSTGRES_PORT: "5432"
      QUERY_MAN_ACCESS_POLICY_FILE: /app/config/access-policies.compose.yaml
      QUERY_MAN_CODEX_MCP_TOKEN: ${QUERY_MAN_CODEX_MCP_TOKEN:?set QUERY_MAN_CODEX_MCP_TOKEN in .env}
      QUERY_MAN_OPERATOR_TOKEN: ${QUERY_MAN_OPERATOR_TOKEN:?set QUERY_MAN_OPERATOR_TOKEN in .env}
      QUERY_MAN_HOST: 0.0.0.0
      QUERY_MAN_LOG_LEVEL: ${QUERY_MAN_LOG_LEVEL:-info}
      QUERY_MAN_DIAGNOSTIC_CAPTURE_DATABASE: ${QUERY_MAN_DIAGNOSTIC_CAPTURE_DATABASE:-}
      QUERY_MAN_DIAGNOSTIC_CAPTURE_KEY: ${QUERY_MAN_DIAGNOSTIC_CAPTURE_KEY:-}
      QUERY_MAN_DIAGNOSTIC_CAPTURE_KEY_ID: ${QUERY_MAN_DIAGNOSTIC_CAPTURE_KEY_ID:-}
      QUERY_MAN_DIAGNOSTIC_CAPTURE_DAILY_BYTES: ${QUERY_MAN_DIAGNOSTIC_CAPTURE_DAILY_BYTES:-104857600}
      QUERY_MAN_METADATA_CACHE_TTL_MS: ${QUERY_MAN_METADATA_CACHE_TTL_MS:-30000}
      QUERY_MAN_METADATA_MAX_STALE_MS: ${QUERY_MAN_METADATA_MAX_STALE_MS:-300000}
      QUERY_MAN_METADATA_RETRY_DELAY_MS: ${QUERY_MAN_METADATA_RETRY_DELAY_MS:-5000}
      QUERY_MAN_MCP_ALLOWED_HOSTS: "127.0.0.1:*,localhost:*"
      QUERY_MAN_MCP_ALLOWED_ORIGINS: "http://127.0.0.1:*,http://localhost:*"
      QUERY_MAN_PORT: "3000"
      QUERY_MAN_POSTGRES_HOST: postgres
      QUERY_MAN_SHUTDOWN_GRACE_MS: ${QUERY_MAN_SHUTDOWN_GRACE_MS:-10000}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "127.0.0.1:${QUERY_MAN_PORT:-3000}:3000"
    volumes:
      - diagnostic_captures:/var/lib/query-man/diagnostics
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import sys, urllib.request;
          payload = urllib.request.urlopen('http://127.0.0.1:3000/ready', timeout=2).read();
          sys.exit(0 if payload == b'{"status":"ready"}' else 1)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_signal: SIGTERM
    stop_grace_period: 30s

  query-man-replica:
    <<: *query-man-service
    profiles: [soak]
    ports:
      - "127.0.0.1:${QUERY_MAN_REPLICA_PORT:-3001}:3000"

volumes:
  diagnostic_captures:
  postgres_data:
