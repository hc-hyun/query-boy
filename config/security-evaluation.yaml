version: 1
validation_rejections:
  - id: write-insert
    category: write
    sql: "INSERT INTO signal_schema.case_files_view VALUES (1)"
    expected_code: SQL_STATEMENT_NOT_ALLOWED
  - id: write-update
    category: write
    sql: "UPDATE signal_schema.case_files_view SET status = 'CLOSED'"
    expected_code: SQL_STATEMENT_NOT_ALLOWED
  - id: write-delete-cte
    category: write
    sql: >-
      WITH changed AS (DELETE FROM signal_schema.case_files_view RETURNING *)
      SELECT * FROM changed
    expected_code: SQL_NESTED_STATEMENT_NOT_ALLOWED
  - id: write-select-into
    category: write
    sql: "SELECT * INTO TEMP snapshot FROM signal_schema.case_files_view"
    expected_code: SQL_SELECT_INTO_NOT_ALLOWED
  - id: write-row-lock
    category: write
    sql: "SELECT * FROM signal_schema.case_files_view FOR UPDATE"
    expected_code: SQL_ROW_LOCK_NOT_ALLOWED
  - id: privilege-grant
    category: privilege_escalation
    sql: "GRANT query_man_reader TO current_user"
    expected_code: SQL_STATEMENT_NOT_ALLOWED
  - id: privilege-set-role
    category: privilege_escalation
    sql: "SET ROLE postgres"
    expected_code: SQL_STATEMENT_NOT_ALLOWED
  - id: privilege-call
    category: privilege_escalation
    sql: "CALL signal_schema.promote_user()"
    expected_code: SQL_STATEMENT_NOT_ALLOWED
  - id: privilege-copy-program
    category: privilege_escalation
    sql: "COPY (SELECT 1) TO PROGRAM 'id'"
    expected_code: SQL_STATEMENT_NOT_ALLOWED
  - id: system-pg-catalog
    category: system_object
    sql: "SELECT * FROM pg_catalog.pg_roles"
    expected_code: SQL_RELATION_NOT_ALLOWED
  - id: system-information-schema
    category: system_object
    sql: "SELECT * FROM information_schema.tables"
    expected_code: SQL_RELATION_NOT_ALLOWED
  - id: system-temp-schema
    category: system_object
    sql: "SELECT * FROM pg_temp.session_data"
    expected_code: SQL_RELATION_NOT_ALLOWED
  - id: system-current-user
    category: system_object
    sql: "SELECT current_user"
    expected_code: SQL_VALUE_FUNCTION_NOT_ALLOWED
  - id: system-read-file
    category: system_object
    sql: "SELECT pg_read_file('/etc/passwd')"
    expected_code: SQL_FUNCTION_NOT_ALLOWED
  - id: resource-sleep
    category: resource_limit_bypass
    sql: "SELECT pg_sleep(60)"
    expected_code: SQL_FUNCTION_NOT_ALLOWED
  - id: resource-table-function
    category: resource_limit_bypass
    sql: "SELECT * FROM generate_series(1, 1000000000)"
    expected_code: SQL_TABLE_FUNCTION_NOT_ALLOWED
  - id: resource-recursive-cte
    category: resource_limit_bypass
    sql: >-
      WITH RECURSIVE items AS
      (SELECT 1 UNION ALL SELECT 1 FROM items)
      SELECT * FROM items
    expected_code: SQL_RECURSIVE_CTE_NOT_ALLOWED
  - id: resource-tablesample
    category: resource_limit_bypass
    sql: "SELECT * FROM signal_schema.case_files_view TABLESAMPLE SYSTEM(100)"
    expected_code: SQL_TABLESAMPLE_NOT_ALLOWED
  - id: resource-advisory-lock
    category: resource_limit_bypass
    sql: "SELECT pg_advisory_lock(1)"
    expected_code: SQL_FUNCTION_NOT_ALLOWED
  - id: resource-sequence-write
    category: resource_limit_bypass
    sql: "SELECT nextval('secret_sequence')"
    expected_code: SQL_FUNCTION_NOT_ALLOWED
  - id: resource-multiple-statements
    category: resource_limit_bypass
    sql: "SELECT 1; SELECT * FROM signal_schema.case_files_view"
    expected_code: SQL_MULTIPLE_STATEMENTS
  - id: resource-sql-byte-limit
    category: resource_limit_bypass
    sql: "SELECT '01234567890123456789'"
    max_sql_bytes: 10
    expected_code: SQL_TOO_LARGE
