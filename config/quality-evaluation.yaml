version: 1

gates:
  min_relation_accuracy: 1.0
  min_answerability_recall: 1.0
  max_context_bytes: 65536

cases:
  - case_id: dev-recent-model-issues
    source_id: development-issues
    question: 최근 90일 동안 모델별 개발 문제 건수와 미해결 건수를 보여줘.
    expected_relations: [ai.issue_overview]
  - case_id: dev-user-activity
    source_id: development-issues
    question: 사용자별 등록 문제 수, 담당 문제 수와 작성 댓글 수를 비교해줘.
    expected_relations: [ai.issue_overview, ai.issue_comments]
  - case_id: dev-critical-without-cause
    source_id: development-issues
    question: 원인이 아직 입력되지 않은 Critical 또는 High 문제를 찾아줘.
    expected_relations: [ai.issue_overview]
  - case_id: dev-top-type-by-version
    source_id: development-issues
    question: HW/SW version 조합별로 가장 많이 발생한 문제 유형은 무엇인가?
    expected_relations: [ai.issue_overview]
  - case_id: dev-comment-paraphrase
    source_id: development-issues
    question: 작성자가 남긴 코멘트 내용을 읽고 싶어
    expected_relations: [ai.issue_comments]
  - case_id: dev-device-population-paraphrase
    source_id: development-issues
    question: 문제가 없는 테스트 기기 모집단 규모를 알려줘
    expected_relations: [ai.test_unit_overview]
  - case_id: dev-unsupported-user-population
    source_id: development-issues
    question: 전체 등록 사용자 수를 알려줘
    expected_relations: [ai.issue_overview]
    expected_answerability: unsupported
  - case_id: market-device-rate
    source_id: market-voc
    question: 모델별 기기 수, VOC 수와 기기당 VOC 수를 높은 순서로 보여줘.
    expected_relations: [ai.device_overview]
  - case_id: market-devices-without-voc
    source_id: market-voc
    question: VOC가 한 번도 없는 기기는 몇 대인가?
    expected_relations: [ai.device_overview]
  - case_id: market-nuri-hinge
    source_id: market-voc
    question: NURI 세대별 힌지 VOC 수를 비교해줘.
    expected_relations: [ai.voc_overview]
  - case_id: market-lot-battery-overheat
    source_id: market-voc
    question: 제조 lot별 전체 VOC 중 배터리 및 과열 VOC 비율을 비교해줘.
    expected_relations: [ai.voc_overview]
  - case_id: market-region-month-unresolved
    source_id: market-voc
    question: 지역과 월별 미해결 VOC 추이를 보여줘.
    expected_relations: [ai.voc_overview]
  - case_id: market-comment-paraphrase
    source_id: market-voc
    question: 고객에게 공개한 댓글의 작성 시각을 보여줘
    expected_relations: [ai.voc_comments]
  - case_id: market-region-open-paraphrase
    source_id: market-voc
    question: 접수된 시장 불량의 지역별 미처리 건수를 비교해줘
    expected_relations: [ai.voc_overview]
  - case_id: market-defect-rate-clarification
    source_id: market-voc
    question: 모델별 불량률을 비교해줘
    expected_relations: [ai.device_overview, ai.voc_overview]
    expected_answerability: needs_clarification
  - case_id: market-monthly-denominator-clarification
    source_id: market-voc
    question: 월별 기기당 VOC 수 추이를 보여줘
    expected_relations: [ai.device_overview, ai.voc_overview]
    expected_answerability: needs_clarification
