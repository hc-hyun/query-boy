version: 1

callers:
  - caller_id: development-analyst
    tenant_id: engineering
    token_env: DEVELOPMENT_ANALYST_API_TOKEN
    allowed_sources:
      - development-issues
    operator: false

  - caller_id: quality-operator
    tenant_id: quality
    token_env: QUALITY_OPERATOR_API_TOKEN
    # Explicitly trusts this caller with current and future control-plane sources.
    # Use allowed_sources instead when the caller must remain source-limited.
    all_sources: true
    operator: true
