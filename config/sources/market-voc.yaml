version: 1

source_id: market-voc
name: 시장 VOC
description: 시장에서 접수된 불량, 제품 기기, 원인, 대응과 댓글
connection:
  host: 127.0.0.1
  host_env: QUERY_MAN_POSTGRES_HOST
  port: 5432
  port_env: POSTGRES_PORT
  database: market_voc
  user: market_voc_reader
  password_env: MARKET_VOC_READER_PASSWORD
  ssl: false
allowed_schemas:
  - ai
allowed_relation_kinds:
  - view
budget_profile: interactive
minimum_quality_level: L2

semantic_overlay:
  default_relation: ai.voc_overview
  relations:
    - relation: ai.voc_overview
      role: event
      description: 시장 VOC의 접수 정보, 불량 분류, 원인, 대응, 제품과 관측 버전 조회
      aliases:
        - 시장 VOC
        - 시장 불량
        - 시장 인입
        - 고객 불만
        - 고객 접수
      grain:
        name: market_voc_case
        description: 시장 VOC 1건
        key_columns: [voc_id]
      default_time_column: received_at
      use_for:
        - 최근 VOC
        - 모델별 VOC 건수
        - 지역별 VOC
        - 월별 미해결 VOC
        - 월별 기기당 VOC 수
        - 불량 유형별 VOC
        - 힌지 VOC
        - 제조 lot별 배터리 과열 VOC 비율
        - 제조 lot별 배터리 및 과열 VOC 비율
        - 제조 lot별 전체 VOC 중 배터리 및 과열 VOC 비율
        - 원인과 대응
        - 댓글 수
      column_aliases:
        received_at: [접수일, 접수 시각, 인입일]
        registered_by_user_id: [접수 사용자 ID, 등록 사용자 ID]
        assigned_to_user_id: [담당 사용자 ID, 담당자 ID]
        manufacturing_lot: [제조 lot, 제조 로트, 생산 로트]
        problem_detail: [문제점 상세, 불량 상세]
        analysis_cause: [원인, 분석 원인]
        response_action: [대책, 대응, 조치]
        defect_category: [불량 분류, 불량 유형]
        market_region: [시장 지역, 권역]
        hw_version: [HW 버전, 하드웨어 버전]
        sw_version: [SW 버전, 소프트웨어 버전]
        comment_count: [댓글 수, 코멘트 수]
      value_hints:
        voc_type: [DEFECT, COMPLAINT, INQUIRY, SUGGESTION]
        defect_category: [BATTERY, DISPLAY, HINGE, CONNECTIVITY, CAMERA, SOFTWARE, OVERHEATING, OTHER]
        severity: [CRITICAL, HIGH, MEDIUM, LOW]
        status: [RECEIVED, TRIAGED, IN_PROGRESS, RESOLVED, CLOSED]
        intake_channel: [SERVICE_CENTER, CALL_CENTER, MOBILE_APP, PARTNER, MONITORING]
      measures:
        - name: voc_count
          description: 선택된 시장 VOC 행의 건수
          aliases: [VOC 수, VOC 건수, 접수 건수]
          aggregation: count_rows
        - name: comment_count
          description: VOC별 사전 집계 댓글 수의 합계
          aliases: [댓글 수, 코멘트 수]
          aggregation: sum
          column: comment_count

    - relation: ai.voc_comments
      role: comment
      description: 시장 VOC에 달린 개별 댓글의 본문, 공개 범위, 작성자와 작성 시각 조회
      aliases:
        - VOC 댓글
        - 댓글 상세
        - 댓글 본문
        - 댓글 작성자
        - 고객 공개 댓글
      grain:
        name: market_voc_comment
        description: 시장 VOC 댓글 1건
        key_columns: [comment_id]
      default_time_column: commented_at
      use_for:
        - 댓글 내용
        - 댓글 작성자별
        - 공개 댓글
        - 내부 댓글
      column_aliases:
        visibility: [공개 범위, 고객 공개 여부]
        author_user_id: [댓글 작성자 ID]
        comment: [댓글 내용, 댓글 본문]
        commented_at: [댓글 작성일, 댓글 시각]
      value_hints:
        visibility: [INTERNAL, PUBLIC]
        comment_type: [INTAKE, INVESTIGATION, CUSTOMER_RESPONSE, RESOLUTION, GENERAL]
      measures:
        - name: comment_count
          description: 선택된 개별 댓글 행의 건수
          aliases: [작성 댓글 수, 댓글 수]
          aggregation: count_rows

    - relation: ai.device_overview
      role: population
      description: VOC가 없는 제품까지 포함한 판매 기기 모집단과 기기별 VOC 건수 조회
      aliases:
        - 판매 기기
        - 제품 기기
        - 단말
        - VOC 없는 기기
        - 기기 분모
      grain:
        name: sold_device
        description: 판매 기기 1대
        key_columns: [device_id]
      default_time_column: sold_at
      use_for:
        - 모델별 기기 수
        - VOC가 없는 기기
        - VOC가 한 번도 없는 기기
        - 기기당 VOC 수
        - 월별 기기당 VOC 수
        - 판매 기기 분모
        - 기기별 VOC 건수
      column_aliases:
        serial_number: [시리얼 번호, 제조 번호]
        manufacturing_lot: [제조 lot, 제조 로트, 생산 로트]
        voc_count: [VOC 건수]
        unresolved_voc_count: [미해결 VOC 건수]
      measures:
        - name: device_count
          description: 선택된 판매 기기 행의 대수
          aliases: [기기 수, 판매 기기 수]
          aggregation: count_rows
        - name: voc_count
          description: 기기별 사전 집계 VOC 건수의 합계
          aliases: [VOC 수, VOC 건수]
          aggregation: sum
          column: voc_count
        - name: unresolved_voc_count
          description: 기기별 사전 집계 미해결 VOC 건수의 합계
          aliases: [미해결 VOC 수]
          aggregation: sum
          column: unresolved_voc_count
        - name: voc_per_device
          description: 선택된 기기의 기기당 VOC 수
          aliases: [기기당 VOC 수]
          aggregation: ratio
          numerator_measure: voc_count
          denominator_measure: device_count

  business_terms:
    - name: unresolved
      description: 시장 VOC status가 RESOLVED 또는 CLOSED가 아닌 상태
      aliases: [미해결, 해결되지 않은 VOC, 오픈 VOC]
      predicates:
        - relation: ai.voc_overview
          column: status
          operator: not_in
          values: [RESOLVED, CLOSED]

    - name: public_comment
      description: 고객에게 공개되는 VOC 댓글
      aliases: [공개 댓글, 고객 공개 댓글]
      predicates:
        - relation: ai.voc_comments
          column: visibility
          operator: equal
          values: [PUBLIC]

    - name: battery_overheating_voc_share
      description: 제조 lot 내 전체 VOC 중 BATTERY 또는 OVERHEATING 분류가 차지하는 비율
      aliases:
        - 제조 lot별 배터리 및 과열 VOC 비율
        - 제조 lot별 전체 VOC 중 배터리 및 과열 VOC 비율
        - lot별 배터리 과열 비율
      calculation: manufacturing_lot으로 그룹화하고 BATTERY 또는 OVERHEATING인 VOC 수를 같은 lot의 전체 VOC 수로 나눈다.

  question_rules:
    - code: USER_POPULATION_NOT_EXPOSED
      status: unsupported
      phrases: [전체 사용자 수, 전체 등록 사용자 수, 사용자 모집단]
      message: ai schema에 사용자 grain view가 없어 활동이 없는 전체 사용자 수를 계산할 수 없다.
      missing_concepts: [user population]
      options: [VOC 활동 기록에 등장한 사용자 수로 질문 범위를 바꾼다.]

    - code: DEFECT_RATE_DEFINITION_REQUIRED
      status: needs_clarification
      phrases: [불량률]
      message: 불량률이 기기당 VOC 수인지 VOC가 있는 기기 비율인지 정의가 필요하다.
      missing_concepts: [defect rate definition]
      options: [VOC 건수 / 판매 기기 수, VOC가 한 건 이상인 기기 수 / 판매 기기 수]

    - code: MONTHLY_DEVICE_DENOMINATOR_REQUIRED
      status: needs_clarification
      phrases: [월별 기기당 VOC 수]
      message: 월별 분모를 해당 월 판매 기기인지 월말 누적 판매 기기인지 정의해야 한다.
      missing_concepts: [monthly device denominator]
      options: [해당 월 판매 기기, 월말 누적 판매 기기, 전체 판매 기기]

  joins:
    - left_relation: ai.voc_overview
      right_relation: ai.voc_comments
      column_pairs:
        - left: voc_id
          right: voc_id
      cardinality: one_to_many
      fanout: true
      guidance: 댓글을 VOC별로 먼저 집계한 뒤 voc_id로 결합해야 VOC 건수가 중복되지 않는다.
