version: 1

queries:
  - query_id: development-recent-model-issues
    source_id: development-issues
    question: 최근 90일 동안 모델별 개발 문제 건수와 미해결 건수를 보여줘.
    metadata_revision: sha256:bc8f0e8463bbde03749d7aed3f1d50210f31462f6578814aa6bbaba89753d50b
    relations: [ai.issue_overview]
    sql: >-
      SELECT model_name, count(*) AS issue_count,
      count(*) FILTER (WHERE status <> 'RESOLVED') AS unresolved_issue_count
      FROM ai.issue_overview
      WHERE discovered_at >=
      '2026-05-24T00:00:00+09'::pg_catalog.timestamptz
      GROUP BY model_name
      ORDER BY issue_count DESC, model_name
    expected:
      columns: [model_name, issue_count, unresolved_issue_count]
      row_count: 6
      result_hash: sha256:1b98b84944a15bf8f99ea02d65cb42bbf265dbe9a061fa1bc6f041af3e3aaf1a

  - query_id: development-critical-without-cause
    source_id: development-issues
    question: 원인이 아직 입력되지 않은 Critical 또는 High 문제를 찾아줘.
    metadata_revision: sha256:bc8f0e8463bbde03749d7aed3f1d50210f31462f6578814aa6bbaba89753d50b
    relations: [ai.issue_overview]
    sql: >-
      SELECT issue_id, issue_no, severity, title, discovered_at
      FROM ai.issue_overview
      WHERE cause IS NULL AND severity IN ('CRITICAL', 'HIGH')
      ORDER BY severity, discovered_at DESC, issue_id
    expected:
      columns: [issue_id, issue_no, severity, title, discovered_at]
      row_count: 62
      result_hash: sha256:f0fd4d0d5eefe8f39149629c1598bb4a3b0244280ca1a4096852ca08af6ad79a

  - query_id: development-user-activity
    source_id: development-issues
    question: 사용자별 등록 문제 수, 담당 문제 수와 작성 댓글 수를 비교해줘.
    metadata_revision: sha256:bc8f0e8463bbde03749d7aed3f1d50210f31462f6578814aa6bbaba89753d50b
    relations: [ai.issue_overview, ai.issue_comments]
    sql: >-
      WITH registered AS (
        SELECT reporter_user_id AS user_id, count(*) AS registered_count
        FROM ai.issue_overview GROUP BY reporter_user_id
      ), assigned AS (
        SELECT assignee_user_id AS user_id, count(*) AS assigned_count
        FROM ai.issue_overview
        WHERE assignee_user_id IS NOT NULL GROUP BY assignee_user_id
      ), commented AS (
        SELECT author_user_id AS user_id, count(*) AS comment_count
        FROM ai.issue_comments GROUP BY author_user_id
      )
      SELECT coalesce(registered.user_id, assigned.user_id, commented.user_id) AS user_id,
      coalesce(registered.registered_count, 0) AS registered_count,
      coalesce(assigned.assigned_count, 0) AS assigned_count,
      coalesce(commented.comment_count, 0) AS comment_count
      FROM registered FULL JOIN assigned USING (user_id)
      FULL JOIN commented
      ON commented.user_id = coalesce(registered.user_id, assigned.user_id)
      ORDER BY user_id
    expected:
      columns: [user_id, registered_count, assigned_count, comment_count]
      row_count: 18
      result_hash: sha256:b5d005c989220ef0ff470a874ea402af3bcdc37d6a05c6bf974b7e240672b698

  - query_id: development-top-issue-type-by-version
    source_id: development-issues
    question: HW/SW version 조합별로 가장 많이 발생한 문제 유형은 무엇인가?
    metadata_revision: sha256:bc8f0e8463bbde03749d7aed3f1d50210f31462f6578814aa6bbaba89753d50b
    relations: [ai.issue_overview]
    sql: >-
      WITH counts AS (
        SELECT hw_version, sw_version, issue_type, count(*) AS issue_count
        FROM ai.issue_overview
        GROUP BY hw_version, sw_version, issue_type
      ), ranked AS (
        SELECT hw_version, sw_version, issue_type, issue_count,
        row_number() OVER (
          PARTITION BY hw_version, sw_version
          ORDER BY issue_count DESC, issue_type
        ) AS rank_no
        FROM counts
      )
      SELECT hw_version, sw_version, issue_type, issue_count
      FROM ranked WHERE rank_no = 1
      ORDER BY hw_version, sw_version
    expected:
      columns: [hw_version, sw_version, issue_type, issue_count]
      row_count: 25
      result_hash: sha256:b5361376f8365c7cabfd88c16265822490e4d64417c22c03956bbb35f813dc31

  - query_id: market-model-voc-rate
    source_id: market-voc
    question: 모델별 기기 수, VOC 수와 기기당 VOC 수를 높은 순서로 보여줘.
    metadata_revision: sha256:5a28fecb7616e9cc35d936b15aa6b903508d84941e5e9317ecb81030632bb799
    relations: [ai.device_overview]
    sql: >-
      SELECT model_name, count(*) AS device_count, sum(voc_count) AS voc_count,
      round(sum(voc_count)::pg_catalog.numeric / count(*), 2) AS voc_per_device
      FROM ai.device_overview
      GROUP BY model_name
      ORDER BY voc_per_device DESC, model_name
    expected:
      columns: [model_name, device_count, voc_count, voc_per_device]
      row_count: 8
      result_hash: sha256:d962d4b7293e88654fbecea95896f53ad17a525b4f366f61d2307d70ad44652b

  - query_id: market-devices-without-voc
    source_id: market-voc
    question: VOC가 한 번도 없는 기기는 몇 대인가?
    metadata_revision: sha256:5a28fecb7616e9cc35d936b15aa6b903508d84941e5e9317ecb81030632bb799
    relations: [ai.device_overview]
    sql: >-
      SELECT count(*) AS devices_without_voc
      FROM ai.device_overview WHERE voc_count = 0
    expected:
      columns: [devices_without_voc]
      row_count: 1
      result_hash: sha256:d014cdedfb430395e71a57c020b297d9c1c80107af6bd4190b3fbadb1e650990

  - query_id: market-nuri-hinge-voc
    source_id: market-voc
    question: NURI 세대별 힌지 VOC 수를 비교해줘.
    metadata_revision: sha256:5a28fecb7616e9cc35d936b15aa6b903508d84941e5e9317ecb81030632bb799
    relations: [ai.voc_overview]
    sql: >-
      SELECT model_name, count(*) AS hinge_voc_count
      FROM ai.voc_overview
      WHERE product_family = 'NURI' AND defect_category = 'HINGE'
      GROUP BY model_name ORDER BY model_name
    expected:
      columns: [model_name, hinge_voc_count]
      row_count: 2
      result_hash: sha256:7b255690c9ba4d0aa65837a61ca749e9d4e647f7a722371ff1083502cbb281dc

  - query_id: market-lot-battery-overheat-ratio
    source_id: market-voc
    question: 제조 lot별 전체 VOC 중 배터리 및 과열 VOC 비율을 비교해줘.
    metadata_revision: sha256:5a28fecb7616e9cc35d936b15aa6b903508d84941e5e9317ecb81030632bb799
    relations: [ai.voc_overview]
    sql: >-
      SELECT manufacturing_lot, count(*) AS total_voc_count,
      count(*) FILTER (
        WHERE defect_category IN ('BATTERY', 'OVERHEATING')
      ) AS battery_overheat_count,
      round(
        count(*) FILTER (
          WHERE defect_category IN ('BATTERY', 'OVERHEATING')
        )::pg_catalog.numeric / count(*), 4
      ) AS battery_overheat_ratio
      FROM ai.voc_overview
      GROUP BY manufacturing_lot
      ORDER BY battery_overheat_ratio DESC, manufacturing_lot
    expected:
      columns:
        - manufacturing_lot
        - total_voc_count
        - battery_overheat_count
        - battery_overheat_ratio
      row_count: 15
      result_hash: sha256:25f43b1690378c680b9e4b790db289384745b94bd3fd1653dcf4f8e96339d33d

  - query_id: market-region-month-unresolved
    source_id: market-voc
    question: 지역과 월별 미해결 VOC 추이를 보여줘.
    metadata_revision: sha256:5a28fecb7616e9cc35d936b15aa6b903508d84941e5e9317ecb81030632bb799
    relations: [ai.voc_overview]
    sql: >-
      SELECT market_region,
      date_trunc('month', received_at, 'Asia/Seoul') AS received_month,
      count(*) FILTER (
        WHERE status NOT IN ('RESOLVED', 'CLOSED')
      ) AS unresolved_voc_count
      FROM ai.voc_overview
      GROUP BY market_region, date_trunc('month', received_at, 'Asia/Seoul')
      ORDER BY received_month, market_region
    expected:
      columns: [market_region, received_month, unresolved_voc_count]
      row_count: 186
      result_hash: sha256:c4615c32951acb3e38feab040594d099de2abb79eb165872542c87a3336de732
