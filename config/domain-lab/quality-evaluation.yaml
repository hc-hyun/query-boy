version: 1

gates:
  min_relation_accuracy: 1.0
  min_answerability_recall: 1.0
  max_context_bytes: 65536

cases:
  - case_id: retail-order-status
    source_id: retail-commerce
    question: 주문 상태별 주문 수를 보여줘.
    expected_relations: [ai.order_overview]
  - case_id: retail-category-quantities
    source_id: retail-commerce
    question: 카테고리별 판매 수량을 보여줘.
    expected_relations: [ai.order_lines]
  - case_id: retail-customers-without-orders
    source_id: retail-commerce
    question: 주문이 없는 고객 수를 보여줘.
    expected_relations: [ai.customer_overview]
  - case_id: retail-refund-rate-clarification
    source_id: retail-commerce
    question: 환불률을 보여줘.
    expected_relations: [ai.order_overview]
    expected_answerability: needs_clarification

  - case_id: logistics-delivery-outcome
    source_id: parcel-logistics
    question: 배송 결과별 운송장 수를 보여줘.
    expected_relations: [ai.shipment_overview]
  - case_id: logistics-late-ingest
    source_id: parcel-logistics
    question: 허브별 늦게 수집된 스캔 수를 보여줘.
    expected_relations: [ai.tracking_events]
  - case_id: logistics-hubs-without-scans
    source_id: parcel-logistics
    question: 스캔 활동이 없는 허브를 보여줘.
    expected_relations: [ai.hub_overview]
  - case_id: logistics-delay-rate-clarification
    source_id: parcel-logistics
    question: 배송 지연율을 보여줘.
    expected_relations: [ai.shipment_overview]
    expected_answerability: needs_clarification

  - case_id: energy-reading-quality
    source_id: energy-telemetry
    question: 검침 품질별 검침 수를 보여줘.
    expected_relations: [ai.meter_readings]
  - case_id: energy-outage-region
    source_id: energy-telemetry
    question: 지역별 정전 건수를 보여줘.
    expected_relations: [ai.outage_overview]
  - case_id: energy-meters-without-readings
    source_id: energy-telemetry
    question: 검침이 없는 계량기 수를 보여줘.
    expected_relations: [ai.meter_overview]
  - case_id: energy-local-hour-clarification
    source_id: energy-telemetry
    question: 시간대별 사용량을 보여줘.
    expected_relations: [ai.meter_readings]
    expected_answerability: needs_clarification

  - case_id: clinical-appointment-status
    source_id: clinical-operations
    question: 예약 상태별 예약 수를 보여줘.
    expected_relations: [ai.appointment_overview]
  - case_id: clinical-critical-labs
    source_id: clinical-operations
    question: critical 검사 결과 수를 보여줘.
    expected_relations: [ai.lab_results]
  - case_id: clinical-patients-without-activity
    source_id: clinical-operations
    question: 예약과 검사가 없는 환자 수를 보여줘.
    expected_relations: [ai.patient_overview]
  - case_id: clinical-pending-value-unsupported
    source_id: clinical-operations
    question: pending 검사 수치를 보여줘.
    expected_relations: [ai.lab_results]
    expected_answerability: unsupported

  - case_id: saas-subscription-status
    source_id: saas-billing
    question: 구독 상태별 구독 수를 보여줘.
    expected_relations: [ai.subscription_overview]
  - case_id: saas-overdue-invoices
    source_id: saas-billing
    question: 연체 invoice 수를 보여줘.
    expected_relations: [ai.invoice_overview]
  - case_id: saas-product-overage
    source_id: saas-billing
    question: 제품 영역별 초과 사용량을 보여줘.
    expected_relations: [ai.usage_daily]
  - case_id: saas-payment-recovery-unsupported
    source_id: saas-billing
    question: invoice 결제 실패 후 회수율을 보여줘.
    expected_relations: [ai.invoice_overview]
    expected_answerability: unsupported
