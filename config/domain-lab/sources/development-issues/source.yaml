version: 4

source_id: development-issues
name: 개발 문제점
description: 개발 및 검증 과정에서 발견한 문제, 원인, 대책과 댓글
view_contract_version: 1
provenance:
  owner: query-man
  environment: development
  database_migration_ref: config/domain-lab/sources/development-issues/views.sql
connection:
  host: 127.0.0.1
  host_env: QUERY_MAN_POSTGRES_HOST
  port: 5432
  port_env: POSTGRES_PORT
  database: development_issues
  user: development_issues_reader
  password_env: DEVELOPMENT_ISSUES_READER_PASSWORD
  sslmode: disable
allowed_schemas:
  - ai
allowed_relation_kinds:
  - view
budget_profile: interactive

semantic_overlay:
  default_relation: ai.issue_overview
  relations:
    - relation: ai.issue_overview
      role: event
      description: 개발 문제의 상태, 원인, 대책, 모델, 시험기와 관측 버전 조회
      aliases:
        - 개발 문제
        - 개발 이슈
        - 문제점
        - 결함
        - 보고자
        - 담당자
      grain:
        name: development_issue
        description: 개발 문제 1건
        key_columns: [issue_id]
      default_time_column: discovered_at
      use_for:
        - 최근 문제
        - 모델별 문제 건수
        - 모델별 개발 문제 건수
        - 미해결 문제
        - 미해결 건수
        - 심각도별 문제
        - 원인과 대책
        - HW SW 버전별 문제
        - HW SW version 조합별 문제
        - HW/SW version 조합별
        - 등록 문제 수
        - 담당 문제 수
        - 댓글 수
      column_aliases:
        discovered_at: [발견일, 발생일, 날짜]
        reporter_user_id: [등록 사용자 ID, 보고자 ID, 보고자, 문제 등록자]
        assignee_user_id: [담당 사용자 ID, 담당자 ID, 담당자]
        problem_detail: [문제점 상세, 문제 상세]
        cause: [원인, 근본 원인]
        countermeasure: [대책, 개선 대책]
        hw_version: [HW 버전, 하드웨어 버전]
        sw_version: [SW 버전, 소프트웨어 버전]
        comment_count: [댓글 수, 코멘트 수]
      value_hints:
        issue_type: [HARDWARE, SOFTWARE, FIRMWARE, MECHANICAL, INTERFACE]
        severity: [CRITICAL, HIGH, MEDIUM, LOW]
        status: [OPEN, ANALYZING, ACTION_PLANNED, VERIFYING, RESOLVED]
      measures:
        - name: issue_count
          description: 선택된 개발 문제 행의 건수
          aliases: [문제 수, 문제 건수, 개발 문제 수]
          aggregation: count_rows
        - name: comment_count
          description: 문제별 사전 집계 댓글 수의 합계
          aliases: [댓글 수, 코멘트 수]
          aggregation: sum
          column: comment_count

    - relation: ai.issue_comments
      role: comment
      description: 개발 문제에 달린 개별 댓글의 본문, 작성자와 작성 시각 조회
      aliases:
        - 문제 댓글
        - 댓글 상세
        - 댓글 본문
        - 댓글 작성자
        - 코멘트
        - 작성 댓글
      grain:
        name: development_issue_comment
        description: 개발 문제 댓글 1건
        key_columns: [comment_id]
      default_time_column: commented_at
      use_for:
        - 댓글 내용
        - 댓글 작성자별
        - 댓글 작성 시각
        - 작성 댓글 수
        - 사용자별 댓글 수
      column_aliases:
        author_user_id: [댓글 작성자 ID]
        comment: [댓글 내용, 댓글 본문]
        commented_at: [댓글 작성일, 댓글 시각]
      value_hints:
        comment_type: [INVESTIGATION, STATUS, DECISION, GENERAL]
      measures:
        - name: comment_count
          description: 선택된 개별 댓글 행의 건수
          aliases: [작성 댓글 수, 댓글 수]
          aggregation: count_rows

    - relation: ai.test_unit_overview
      role: population
      description: 문제가 없는 장비까지 포함한 개발 시험기 모집단과 문제 건수 조회
      aliases:
        - 시험기
        - 테스트 기기
        - 시험 장비
        - 시제품
        - 문제 없는 시험기
      grain:
        name: development_test_unit
        description: 개발 시험기 1대
        key_columns: [test_unit_id]
      default_time_column: manufactured_at
      use_for:
        - 모델별 시험기 수
        - 문제가 없는 시험기
        - 시험기당 문제 수
        - 시험기 분모
      column_aliases:
        serial_number: [시리얼 번호, 제조 번호]
        issue_count: [문제 건수]
        unresolved_issue_count: [미해결 문제 건수]
      measures:
        - name: test_unit_count
          description: 선택된 개발 시험기 행의 대수
          aliases: [시험기 수, 테스트 기기 수]
          aggregation: count_rows
        - name: issue_count
          description: 시험기별 사전 집계 문제 건수의 합계
          aliases: [문제 수, 문제 건수]
          aggregation: sum
          column: issue_count
        - name: unresolved_issue_count
          description: 시험기별 사전 집계 미해결 문제 건수의 합계
          aliases: [미해결 문제 수]
          aggregation: sum
          column: unresolved_issue_count

  business_terms:
    - name: unresolved
      description: 개발 문제 status가 RESOLVED가 아닌 상태
      aliases: [미해결, 해결되지 않은 문제, 오픈 문제]
      predicates:
        - relation: ai.issue_overview
          column: status
          operator: not_equal
          values: [RESOLVED]

    - name: root_cause_missing
      description: 근본 원인이 아직 입력되지 않은 개발 문제
      aliases: [원인이 아직 입력되지 않은, 원인 미입력, 원인 없음]
      predicates:
        - relation: ai.issue_overview
          column: cause
          operator: is_null

    - name: countermeasure_missing
      description: 개선 대책이 아직 입력되지 않은 개발 문제
      aliases: [대책 미입력, 대책 없음]
      predicates:
        - relation: ai.issue_overview
          column: countermeasure
          operator: is_null

  question_rules:
    - code: USER_POPULATION_NOT_EXPOSED
      status: unsupported
      phrases: [전체 사용자 수, 전체 등록 사용자 수, 사용자 모집단]
      message: ai schema에 사용자 grain view가 없어 활동이 없는 전체 사용자 수를 계산할 수 없다.
      missing_concepts: [user population]
      options: [활동 기록에 등장한 사용자 수로 질문 범위를 바꾼다.]

  composition_hints:
    - name: user_activity_by_role
      phrases:
        - 사용자별 등록 문제 수, 담당 문제 수와 작성 댓글 수
        - 보고자와 담당자, 댓글 작성자별 활동 건수
      strategy: aggregate_each_then_combine
      guidance: issue_overview를 reporter_user_id와 assignee_user_id로 각각 집계하고 issue_comments를 author_user_id로 집계한 뒤, 세 ID를 business_user_id로 맞춰 full outer join한다. issue_id raw join은 사용하지 않는다.
      combine_keys: [business_user_id]

  joins:
    - left_relation: ai.issue_overview
      right_relation: ai.issue_comments
      column_pairs:
        - left: issue_id
          right: issue_id
      cardinality: one_to_many
      fanout: true
      guidance: 댓글을 문제별로 먼저 집계한 뒤 issue_id로 결합해야 문제 건수가 중복되지 않는다.
