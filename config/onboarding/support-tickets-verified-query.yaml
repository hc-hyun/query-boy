query_id: support-tickets-by-queue
question: 지원 queue별 ticket 수를 보여줘.
sql: >-
  SELECT queue_name, count(*) AS ticket_count
  FROM ai.ticket_overview
  GROUP BY queue_name
  ORDER BY queue_name
relations: [ai.ticket_overview]
expected:
  columns: [queue_name, ticket_count]
  row_count: 3
