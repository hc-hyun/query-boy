name: ci

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked
      - name: Start deterministic PostgreSQL fixtures
        run: |
          cp .env.example .env
          docker compose up -d --wait
          ./scripts/apply-db.sh
      - name: Static and unit checks
        run: |
          uv run ruff check .
          uv run mypy src
          uv run pytest
      - name: Database, retrieval and golden checks
        run: |
          uv run pytest -m integration
          uv run query-man-evaluate
          uv run query-man-verify
      - name: Stop fixtures
        if: always()
        run: docker compose down -v

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Audit locked Python dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/query-man-requirements.txt
          uvx pip-audit --requirement /tmp/query-man-requirements.txt
      - name: Scan repository history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source=/repo --no-banner
      - name: Scan repository configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Scan PostgreSQL fixture image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: postgres:18.6-bookworm
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
