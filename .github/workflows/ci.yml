name: ci

on:
  pull_request:
  push:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked
      - name: Static analysis and unit checks
        run: |
          uv run ruff check .
          uv run ruff check src/query_man/runtime --select C901 --config "lint.mccabe.max-complexity=19"
          uv run mypy src
          uv run pytest -m 'not integration and not load'
