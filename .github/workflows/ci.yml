name: ci

on:
  pull_request:
  push:

jobs:
  yaml-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked
      - name: Start Git-reviewed YAML PostgreSQL fixtures
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up -d --wait postgres
          ./scripts/apply-db.sh
      - name: Static analysis and unit checks
        run: |
          uv run ruff check .
          uv run mypy src
          uv run pytest -m 'not integration and not load and not soak and not mcp_server'
      - name: Database, retrieval and golden checks
        run: |
          uv run pytest -m 'integration and not load and not soak and not mcp_server'
          uv run query-man-evaluate
          uv run query-man-verify
      - name: Bounded load check
        run: uv run pytest -m load tests/test_load.py
      - name: Stop fixtures
        if: always()
        run: docker compose down -v

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      QUERY_MAN_CODEX_MCP_TOKEN: ci-only-not-a-secret-container-token-0001
      QUERY_MAN_VCS_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked test environment
        run: uv sync --locked
      - name: Start containerized HTTP and MCP runtime
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 120 postgres
          ./scripts/apply-db.sh
          docker compose build --build-arg QUERY_MAN_VCS_REF="$QUERY_MAN_VCS_REF" query-man
          docker compose up -d --no-build --wait --wait-timeout 120 query-man
      - name: Verify container and MCP boundary
        run: |
          revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$(docker compose ps -q query-man)")"
          test "$revision" = "$QUERY_MAN_VCS_REF"
          ./scripts/verify-container.sh
      - name: Verify MCP usability, contracts and bounded parallel load
        run: uv run pytest -m 'mcp_server and not soak' -s
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 query-man
      - name: Stop containerized runtime
        if: always()
        run: docker compose down -v --remove-orphans

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Audit locked Python dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/query-man-requirements.txt
          uvx pip-audit --requirement /tmp/query-man-requirements.txt
      - name: Scan repository history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source=/repo --gitleaks-ignore-path=/repo/.gitleaksignore --no-banner
      - name: Scan repository configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Scan PostgreSQL fixture image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
      - name: Build Query Man application image
        run: docker build --pull --tag query-man:ci .
      - name: Scan Query Man application image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: query-man:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
