services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    container_name: query-man-postgres
    restart: unless-stopped
    environment:
      DEVELOPMENT_ISSUES_READER_PASSWORD: ${DEVELOPMENT_ISSUES_READER_PASSWORD}
      MARKET_VOC_READER_PASSWORD: ${MARKET_VOC_READER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8 --auth-host=scram-sha-256
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      TZ: ${TZ:-Asia/Seoul}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=1000
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init/01-source-bootstrap.sh:/docker-entrypoint-initdb.d/01-source-bootstrap.sh:ro
      - ./docker/postgres/init/10-development-issues-schema.sql:/docker-entrypoint-initdb.d/10-development-issues-schema.sql:ro
      - ./config/sources/development-issues/views.sql:/query-man-source-views/development-issues.sql:ro
      - ./docker/postgres/init/20-development-issues-seed.sql:/docker-entrypoint-initdb.d/20-development-issues-seed.sql:ro
      - ./docker/postgres/init/30-market-voc-schema.sql:/docker-entrypoint-initdb.d/30-market-voc-schema.sql:ro
      - ./config/sources/market-voc/views.sql:/query-man-source-views/market-voc.sql:ro
      - ./docker/postgres/init/40-market-voc-seed.sql:/docker-entrypoint-initdb.d/40-market-voc-seed.sql:ro
      - ./scripts/validate-static-fixtures.sh:/docker-entrypoint-initdb.d/45-validate-static-fixtures.sh:ro
      - ./docker/postgres/init/90-validate-mvp.sql:/query-man-fixtures/90-validate-mvp.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    shm_size: 256mb
    stop_grace_period: 30s

  query-man:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PORT: "5432"
      QUERY_MAN_POSTGRES_HOST: postgres

  query-man-replica:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PORT: "5432"
      QUERY_MAN_POSTGRES_HOST: postgres

volumes:
  postgres_data:
