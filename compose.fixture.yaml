services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    container_name: query-man-postgres
    restart: unless-stopped
    environment:
      DEVELOPMENT_ISSUES_READER_PASSWORD: ${DEVELOPMENT_ISSUES_READER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8 --auth-host=scram-sha-256
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      TZ: ${TZ:-Asia/Seoul}
    command:
      - postgres
      - -c
      - log_min_duration_statement=1000
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init/01-source-bootstrap.sh:/docker-entrypoint-initdb.d/01-source-bootstrap.sh:ro
      - ./docker/postgres/init/10-fixture-schema.sql:/query-man-fixtures/10-fixture-schema.sql:ro
      - ./tests/fixtures/config/sources/fixture-source/views.sql:/query-man-source-views/fixture-source.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    shm_size: 256mb
    stop_grace_period: 30s

  query-man:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FIXTURE_SOURCE_READER_PASSWORD: ${DEVELOPMENT_ISSUES_READER_PASSWORD}
      POSTGRES_PORT: "5432"
      QUERY_MAN_POSTGRES_HOST: postgres
      QUERY_MAN_SOURCE_DIR: /app/test-fixtures/config/sources
    volumes:
      - ./tests/fixtures/config:/app/test-fixtures/config:ro

  query-man-replica:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FIXTURE_SOURCE_READER_PASSWORD: ${DEVELOPMENT_ISSUES_READER_PASSWORD}
      POSTGRES_PORT: "5432"
      QUERY_MAN_POSTGRES_HOST: postgres
      QUERY_MAN_SOURCE_DIR: /app/test-fixtures/config/sources
    volumes:
      - ./tests/fixtures/config:/app/test-fixtures/config:ro

volumes:
  postgres_data:
