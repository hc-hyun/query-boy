[project]
name = "query-man"
version = "0.1.0"
description = "A safe Text-to-SQL metadata gateway for PostgreSQL sources"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "mcp>=2,<3",
  "pglast>=8.4,<9",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6.0,<7",
  "uvicorn>=0.35,<1",
]

[project.scripts]
query-man = "query_man.server:main"
query-man-verify = "query_man.verified:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "hypothesis>=6.0,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/query_man"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not integration'"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires the local PostgreSQL services",
  "load: runs the bounded local load verification",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["query_man"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
